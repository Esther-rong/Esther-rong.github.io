<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF8233" />
  <meta name="description" content="Esther's personal website. About me, projects, story, and contacts." />
  <title>Esther · Personal Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; --orange: #F16524; --orange-light: #FF8233; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    a { text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    /* ===== 原有 404 主界面 ===== */
    .page { height: 100vh; height: 100dvh; width: 100%; overflow: hidden; position: relative; display: flex; flex-direction: column; isolation: isolate; background: linear-gradient(to bottom, #FF8233, #FDAC55); }
    .background-art { position: absolute; inset: 0; pointer-events: none; opacity: .8; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 95%); mask-image: linear-gradient(to bottom, black 40%, transparent 95%); }
    .background-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .giant-404 { color: #fff; font-size: clamp(200px,48vw,800px); line-height: 1; letter-spacing: -.075em; font-weight: 900; white-space: nowrap; user-select: none; transform-origin: center center; }
    .white-oval { position: absolute; background: #fff; border-radius: 9999px; width: clamp(120px,20vw,400px); height: 50vh; transform-origin: center; }
    .navbar { position: relative; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; gap: 16px; }
    .logo { display: inline-flex; align-items: center; gap: 9px; color: #fff; font-size: 20px; font-weight: 700; white-space: nowrap; }
    .logo-mark { display: grid; grid-template-columns: repeat(2,12px); gap: 2px; }
    .logo-mark span { width: 12px; height: 12px; background: white; border-radius: 50%; }
    .desktop-links { display: flex; gap: 4px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    .desktop-links button { background: #fff; color: var(--orange); padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; transition: opacity .2s; white-space: nowrap; }
    .desktop-links button:hover { opacity: .9; }
    .menu-btn { display: inline-flex; gap: 9px; align-items: center; justify-content: center; padding: 10px 20px; background: var(--orange); color: white; border-radius: 999px; font-size: 14px; font-weight: 500; transition: opacity .2s; }
    .menu-btn:hover { opacity: .9; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .video-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin-top: calc(-6vh - 40px); pointer-events: none; }
    .video-box { width: 62vw; height: 78vh; position: relative; display: grid; place-items: center; }
    .fox-fallback { position: absolute; inset: 0; display: grid; place-items: center; opacity: 1; transition: opacity .45s ease; }
    .fox-illustration { width: min(68%, 440px); max-height: 74%; overflow: visible; filter: drop-shadow(0 20px 12px #a8431533); animation: fox-bob 3.5s ease-in-out infinite; }
    .fox-tail { transform-origin: 75% 73%; animation: fox-wag 2.4s ease-in-out infinite; }
    .fox-eye { transform-origin: center; animation: fox-blink 5s ease-in-out infinite; }
    @keyframes fox-bob { 0%,100% { transform: translateY(6px) rotate(-1deg); } 50% { transform: translateY(-13px) rotate(1deg); } }
    @keyframes fox-wag { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(9deg); } }
    @keyframes fox-blink { 0%,43%,47%,100% { transform: scaleY(1); } 45% { transform: scaleY(.10); } }
    .video-box.video-playing .fox-fallback { opacity: 0; }
    .video-box video { opacity: 0; transition: opacity .45s ease; position: relative; z-index: 1; }
    .video-box.video-playing video { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .fox-illustration,.fox-tail,.fox-eye { animation: none; } }
    .video-box video { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: darken; pointer-events: none; }
    .bottom { position: relative; z-index: 30; margin-top: auto; padding: 0 16px 64px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .bottom h1 { color: #fff; font-weight: 500; font-size: 24px; line-height: 1.4; margin-bottom: 16px; }
    .home-link { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 999px; padding: 16px 32px; background: var(--orange); color: #fff; font-size: 16px; font-weight: 600; transition: transform .25s, box-shadow .25s; }
    .home-link:hover { transform: scale(1.05); box-shadow: 0 12px 30px #9d411e40; }
    
    /* 显眼的新版本提示 */
    .version-tag { margin-top: 12px; color: #fff; font-size: 12px; opacity: 0.8; font-weight: 600; letter-spacing: 1px; }

    /* ===== 移动端菜单 ===== */
    .overlay { position: fixed; inset: 0; z-index: 50; visibility: hidden; pointer-events: none; transition: visibility 0s linear .5s; }
    .overlay.open { visibility: visible; pointer-events: auto; transition-delay: 0s; }
    .backdrop { position: absolute; inset: 0; background: #0006; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; transition: opacity .5s; }
    .overlay.open .backdrop { opacity: 1; }
    .panel { position: absolute; top: 0; right: 0; height: 100%; width: 380px; max-width: 100%; padding: 24px; background: linear-gradient(135deg, #FF6B1A, #FF9642); transform: translateX(100%); transition: transform .5s cubic-bezier(.16,1,.3,1); display: flex; flex-direction: column; }
    .overlay.open .panel { transform: translateX(0); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; }
    .close-btn { width: 40px; height: 40px; border-radius: 50%; background: #ffffff33; color: #fff; display: grid; place-items: center; transition: background .2s; }
    .close-btn:hover { background: #ffffff55; }
    .panel-links { display: flex; flex-direction: column; gap: 12px; margin-top: 64px; }
    .panel-links button { color: white; background: #ffffff1a; border-radius: 16px; padding: 16px 24px; font-size: 18px; font-weight: 600; opacity: 0; transform: translateY(16px); transition: opacity .3s, transform .3s, background .3s; transition-delay: 0ms; text-align: left; }
    .panel-links button:hover { background: #ffffff33; }
    .overlay.open .panel-links button { opacity: 1; transform: translateY(0); transition-delay: calc(150ms + var(--i) * 60ms); }
    .panel-cta { margin-top: auto; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; background: #fff; color: var(--orange); border-radius: 999px; font-size: 16px; font-weight: 600; opacity: 0; transform: translateY(12px); transition: opacity .35s, transform .35s; }
    .overlay.open .panel-cta { opacity: 1; transform: translateY(0); transition-delay: .45s; }
    .panel-cta:hover { transform: scale(1.02) !important; }

    /* ===== 内容模态框 ===== */
    .modal {
      position: fixed; inset: 0; z-index: 80;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .3s ease, visibility 0s linear .3s;
    }
    .modal.open {
      opacity: 1; visibility: visible; pointer-events: auto;
      transition: opacity .3s ease, visibility 0s linear 0s;
    }
    .modal-card {
      background: #fff;
      border-radius: 28px;
      max-width: 800px; width: 100%;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 44px 40px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.2);
      position: relative;
      animation: modalIn .35s cubic-bezier(.16,1,.3,1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 38px; height: 38px; border-radius: 50%;
      background: #fff3ec; color: var(--orange);
      display: grid; place-items: center;
      transition: background .2s, transform .2s;
      z-index: 100; 
    }
    .modal-close:hover { background: #ffe6d8; transform: rotate(90deg); }
    .modal-card .eyebrow {
      display: inline-block; font-size: 12px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--orange); background: #fff3ec;
      padding: 5px 12px; border-radius: 999px; margin-bottom: 16px;
    }
    .modal-card h1 {
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 800; color: #2d1f15;
      line-height: 1.15; letter-spacing: -0.02em;
      margin-bottom: 18px;
    }
    .modal-card h1 .name { color: var(--orange); }
    .modal-card p {
      font-size: 16px; line-height: 1.8; color: #4a3a2e;
      margin-bottom: 14px;
    }
    .modal-card p:last-of-type { margin-bottom: 0; }
    .modal-card strong { color: #2d1f15; font-weight: 700; }
    .modal-card .divider { height: 1px; background: #f0e4da; margin: 24px 0; }
    
    /* Contacts */
    .modal-card .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin: 16px 0 4px; }
    .modal-card .contact-item { background: #fff7f1; border-radius: 16px; padding: 20px 16px; text-align: center; }
    .modal-card .contact-item .ci { width: 40px; height: 40px; border-radius: 50%; background: var(--orange-light); color: #fff; display: grid; place-items: center; margin: 0 auto 10px; }
    .modal-card .contact-item .ci .icon { width: 18px; height: 18px; }
    .modal-card .contact-item h3 { font-size: 14px; color: #2d1f15; margin-bottom: 4px; font-weight: 700; }
    .modal-card .contact-item p { font-size: 13px; color: #5b4b3e; line-height: 1.4; margin: 0; word-break: break-word; }
    .modal-card .contact-item p a { color: var(--orange); font-weight: 600; }

    /* ===== Three.js 3D 游戏容器 ===== */
    .game-container-3d { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; border-radius: 12px; overflow: hidden; border: 2px solid #222; box-shadow: inset 0 0 50px #000; }
    .game-container-3d canvas { display: block; width: 100%; height: 100%; }
    
    /* 游戏 UI */
    .g3d-ui { position: absolute; inset: 0; pointer-events: none; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Courier New', monospace; z-index: 10; }
    .g3d-top { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; }
    .g3d-hp { color: #4cd137; font-size: 24px; }
    .g3d-ammo { color: #fbc531; font-size: 24px; }
    .g3d-kills { color: #e84118; font-size: 20px; }
    
    /* 动态准星 */
    .g3d-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; pointer-events: none; z-index: 5; transition: transform 0.05s; }
    .g3d-crosshair::before, .g3d-crosshair::after { content: ''; position: absolute; background: rgba(0,255,0,0.8); box-shadow: 0 0 2px #000; }
    .g3d-crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
    .g3d-crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
    .g3d-crosshair.shoot { transform: translate(-50%, -50%) scale(1.5); }
    
    /* 屏幕受击闪红 */
    .g3d-damage { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.6) 100%); opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 4; }
    
    .g3d-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 20; text-align: center; }
    .g3d-overlay h2 { font-size: 40px; color: #e84118; margin-bottom: 10px; font-family: Impact, sans-serif; letter-spacing: 2px; text-shadow: 2px 2px 4px #000; }
    .g3d-overlay p { font-size: 15px; margin-bottom: 20px; color: #ccc; font-family: sans-serif; line-height: 1.6; }
    .g3d-start-btn { background: #e84118; color: #fff; padding: 12px 30px; border-radius: 8px; font-size: 18px; font-weight: bold; pointer-events: auto; cursor: pointer; border: 2px solid #fff; transition: all 0.2s; }
    .g3d-start-btn:hover { background: #c0392b; transform: scale(1.05); }

    @media (max-width: 1023px) { .desktop-links { display: none; } }
    @media (max-width: 767px) {
      .navbar { padding: 16px 24px; }
      .video-box { width: 70vw; height: 70vh; }
      .bottom h1 { font-size: 20px; }
      .bottom { padding-bottom: 48px; }
      .white-oval { height: 26vh; }
      .modal-card { padding: 36px 26px; border-radius: 22px; }
    }
    @media (max-width: 639px) {
      .navbar { padding: 16px; }
      .logo { font-size: 18px; }
      .logo-mark { grid-template-columns: repeat(2,10px); }
      .logo-mark span { width: 10px; height: 10px; }
      .menu-btn { padding: 9px 16px; }
      .menu-btn .menu-label { display: none; }
      .video-box { width: 120vw; height: 85vh; }
      .bottom { padding-bottom: 32px; }
      .bottom h1 { font-size: 18px; margin-bottom: 12px; }
      .home-link { padding: 12px 24px; font-size: 14px; }
      .white-oval { height: 22vh; }
      .panel { width: 100%; }
      .modal { padding: 16px; }
      .modal-card { padding: 30px 20px; border-radius: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>

  <!-- ===== 移动端菜单 ===== -->
  <div class="overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="Navigation menu" aria-hidden="true">
    <div class="backdrop" id="menuBackdrop"></div>

  <!-- 引入 Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    /* ---------- 视频与背景缩放 ---------- */
    const foxVideo = document.getElementById('foxVideo');
    const foxVideoBox = document.getElementById('foxVideoBox');
    foxVideo.addEventListener('playing', () => { if (foxVideo.videoWidth > 0) foxVideoBox.classList.add('video-playing'); });
    foxVideo.addEventListener('error', () => foxVideoBox.classList.remove('video-playing'));
    foxVideo.addEventListener('stalled', () => foxVideoBox.classList.remove('video-playing'));
    foxVideo.play().catch(() => foxVideoBox.classList.remove('video-playing'));

    const giant = document.getElementById('giant404');
    const oval = document.getElementById('whiteOval');
    function resizeBackground() {
      const scaleY = window.innerHeight / (giant.offsetHeight || 1);
      giant.style.transform = `scale(1.15, ${scaleY * 1.4})`;
      oval.style.transform = `scaleY(${scaleY})`;
    }
    window.addEventListener('resize', resizeBackground, { passive: true });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resizeBackground);
    resizeBackground();

    /* ---------- 移动端菜单 ---------- */
    const overlay = document.getElementById('menuOverlay');
    const openBtn = document.getElementById('menuOpen');
    const closeBtn = document.getElementById('menuClose');
    const backdrop = document.getElementById('menuBackdrop');

    function setMenu(open) {
      overlay.classList.toggle('open', open);
      overlay.setAttribute('aria-hidden', String(!open));
      openBtn.setAttribute('aria-expanded', String(open));
      document.body.style.overflow = open ? 'hidden' : '';
      if (open) closeBtn.focus(); else openBtn.focus();
    }
    openBtn.addEventListener('click', () => setMenu(true));
    closeBtn.addEventListener('click', () => setMenu(false));
    backdrop.addEventListener('click', () => setMenu(false));

    /* ---------- 内容数据 ---------- */
    const sections = {
      about: `
        <span class="eyebrow">About Me</span>
        <h1>Hi, I'm <span class="name">Esther</span>.</h1>
        <p>I'm a <strong>student at Basis Guangzhou</strong>, and my birthday is <strong>December 19</strong>. I'm someone who likes to stay curious — whether that means learning something new in class, trying a different sport, or finding a better way to explain an idea to a friend.</p>

    /* ---------- 模态框逻辑 ---------- */
    const modal = document.getElementById('contentModal');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');
    
    let cleanupFunctions = []; 

    function openModal(section) {
      if (!sections[section]) return;
      modalBody.innerHTML = sections[section];
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      setTimeout(() => modalClose.focus(), 60);
      
      if (section === 'projects') {
        setTimeout(init3DGame, 50);
      }
    }

    function closeModal() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      
      cleanupFunctions.forEach(fn => fn());
      cleanupFunctions = [];
    }

    document.querySelectorAll('[data-section]').forEach(btn => {
      btn.addEventListener('click', () => {
        const section = btn.getAttribute('data-section');
        if (overlay.classList.contains('open')) setMenu(false);
        openModal(section);
      });
    });

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.pointerLockElement) {
        if (modal.classList.contains('open')) closeModal();
        else if (overlay.classList.contains('open')) setMenu(false);
      }
    });

    /* ==========================================
       CS:GO 风格 Three.js FPS 游戏核心 (真实子弹碰撞)
       ========================================== */
    function init3DGame() {
      const container = document.getElementById('g3dContainer');
      const overlay = document.getElementById('g3dOverlay');
      const startBtn = document.getElementById('g3dStartBtn');
      const hpEl = document.getElementById('g3dHp');
      const ammoEl = document.getElementById('g3dAmmo');
      const killsEl = document.getElementById('g3dKills');
      const damageFlash = document.getElementById('g3dDamage');
      const crosshair = document.getElementById('g3dCrosshair');
      
      if (!container) return;

      // ================= 1. 场景与渲染器 =================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd4c4a8); 
      scene.fog = new THREE.Fog(0xd4c4a8, 10, 70);

      const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 200);
      
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // ================= 2. 光照系统 =================
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
      dirLight.position.set(20, 40, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.top = 40;
      dirLight.shadow.camera.bottom = -40;
      dirLight.shadow.camera.left = -40;
      dirLight.shadow.camera.right = 40;
      scene.add(dirLight);

      // ================= 3. 控制器与地图 =================
      const controls = new PointerLockControls(camera, document.body);
      scene.add(controls.getObject());
      controls.getObject().position.set(0, 1.7, 15); 

      const floorGeo = new THREE.PlaneGeometry(100, 100);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0xc2b280, roughness: 1.0 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const obstacles = [];
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x8b7355, roughness: 0.9 });
      const crateMat = new THREE.MeshStandardMaterial({ color: 0xa0522d, roughness: 0.8 });

      function createBox(x, z, w, h, d, isCrate) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const box = new THREE.Mesh(geo, isCrate ? crateMat : wallMat);
        box.position.set(x, h/2, z);
        box.castShadow = true;
        box.receiveShadow = true;
        scene.add(box);
        obstacles.push(new THREE.Box3().setFromObject(box));
      }

      createBox(0, -15, 30, 4, 2, false);
      createBox(-15, 0, 2, 4, 30, false);
      createBox(15, 0, 2, 4, 30, false);
      createBox(0, 20, 30, 4, 2, false);

      createBox(-6, 5, 4, 2, 4, true);
      createBox(6, -5, 4, 2, 4, true);
      createBox(0, 0, 6, 2, 6, true);
      createBox(-8, -8, 2, 2, 6, true);
      createBox(8, 8, 6, 2, 2, true);

      // ================= 4. 武器模型 =================
      const gunGroup = new THREE.Group();
      const gunMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.8 });
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.8 });
      
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5), gunMat); barrel.rotation.x = Math.PI/2; barrel.position.set(0, 0.05, -0.5);
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.4), gunMat); body.position.set(0, 0, -0.2);
      const woodStock = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.3), woodMat); woodStock.position.set(0, -0.02, 0.1);
      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.2, 0.1), gunMat); mag.position.set(0, -0.15, -0.15); mag.rotation.x = 0.4;
      const sight = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.05, 0.1), gunMat); sight.position.set(0, 0.08, -0.3);

      gunGroup.add(barrel, body, woodStock, mag, sight);
      gunGroup.position.set(0.2, -0.2, -0.5);
      camera.add(gunGroup);

      const muzzleFlash = new THREE.PointLight(0xffaa00, 0, 5);
      muzzleFlash.position.set(0, 0.05, -0.8);
      gunGroup.add(muzzleFlash);

      // ================= 5. 敌人系统 =================
      let enemies = [];
      let enemyBullets = [];
      let spawnTimer = 0;
      const MAX_ENEMIES = 8;
      const SPAWN_INTERVAL = 2.5;

      function spawnEnemy() {
        let valid = false;
        let x, z;
        const playerPos = controls.getObject().position;

        while (!valid) {
          x = (Math.random() - 0.5) * 26; 
          z = (Math.random() - 0.5) * 26 - 2; 
          
          const distToPlayer = Math.sqrt((x - playerPos.x)**2 + (z - playerPos.z)**2);
          if (distToPlayer > 12) {
            const testBox = new THREE.Box3(new THREE.Vector3(x-1, 0, z-1), new THREE.Vector3(x+1, 2, z+1));
            let collides = false;
            for (let obs of obstacles) {
              if (testBox.intersectsBox(obs)) { collides = true; break; }
            }
            if (!collides) valid = true;
          }
        }

        const enemyGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.6 });
        
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), bodyMat); torso.position.y = 1.0; torso.castShadow = true;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), skinMat); head.position.y = 1.6; head.castShadow = true;
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), bodyMat); legL.position.set(-0.15, 0.3, 0);
        const legR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), bodyMat); legR.position.set(0.15, 0.3, 0);
        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), gunMat); gun.position.set(0.25, 1.0, -0.3);

        enemyGroup.add(torso, head, legL, legR, gun);
        enemyGroup.position.set(x, 0, z);
        scene.add(enemyGroup);
        
        enemies.push({
          mesh: enemyGroup,
          hp: 40,
          alive: true,
          lastAttack: 0,
          speed: 2.0 + Math.random() * 1.5
        });
      }

      // ================= 6. 特效与音效 =================
      // 玩家射击曳光弹 (Line)
      const tracers = [];
      function createTracer(start, end) {
        const material = new THREE.LineBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.8 });
        const points = [start.clone(), end.clone()];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        scene.add(line);
        tracers.push({ line, life: 1.0 });
      }

      // 粒子特效 (血雾/火花)
      const particles = [];
      const pGeo = new THREE.BufferGeometry();
      const pCount = 200;
      const pPositions = new Float32Array(pCount * 3);
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
      
      // 使用顶点颜色实现不同颜色的粒子
      const pColors = new Float32Array(pCount * 3);
      pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
      
      const pMat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true });
      const particleSystem = new THREE.Points(pGeo, pMat);
      scene.add(particleSystem);
      let pData = [];

      function spawnParticles(pos, colorHex) {
        const color = new THREE.Color(colorHex);
        for (let i = 0; i < 15; i++) {
          if (pData.length >= pCount) pData.shift(); // 防止溢出
          pData.push({
            pos: pos.clone(),
            vel: new THREE.Vector3((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4),
            life: 1.0,
            color: color
          });
        }
      }

      let audioCtx;
      function playShootSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const bufferSize = audioCtx.sampleRate * 0.1; 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start();
      }

      // ================= 7. 游戏逻辑 =================
      let isRunning = false;
      let animationId;
      let player = { hp: 100, ammo: 30, maxAmmo: 30, kills: 0, isReloading: false };
      let clock = new THREE.Clock();
      let keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };
      
      const raycaster = new THREE.Raycaster();
      const centerScreen = new THREE.Vector2(0, 0); 

      function resetGame() {
        enemies.forEach(e => scene.remove(e.mesh));
        enemies = [];
        enemyBullets.forEach(b => scene.remove(b.mesh));
        enemyBullets = [];
        
        controls.getObject().position.set(0, 1.7, 15);
        camera.rotation.set(0, 0, 0); 
        
        player = { hp: 100, ammo: 30, maxAmmo: 30, kills: 0, isReloading: false };
        updateUI();

        spawnTimer = 0;
        spawnEnemy();
        spawnEnemy();
        spawnEnemy();
      }

      function updateUI() {
        hpEl.textContent = player.hp;
        ammoEl.textContent = player.ammo;
        killsEl.textContent = player.kills;
      }

      function reload() {
        if (player.isReloading || player.ammo === player.maxAmmo) return;
        player.isReloading = true;
        setTimeout(() => {
          player.ammo = player.maxAmmo;
          player.isReloading = false;
          updateUI();
        }, 1000);
      }

      function shoot() {
        if (!isRunning || document.pointerLockElement !== document.body) return;
        if (player.ammo <= 0) { reload(); return; }

        player.ammo--;
        updateUI();
        playShootSound();

        crosshair.classList.add('shoot');
        setTimeout(() => crosshair.classList.remove('shoot'), 100);

        const originalPos = gunGroup.position.clone();
        const originalRot = gunGroup.rotation.clone();
        gunGroup.position.z += 0.1;
        gunGroup.rotation.x += 0.1;
        camera.rotation.x += 0.015;

        setTimeout(() => {
          gunGroup.position.copy(originalPos);
          gunGroup.rotation.copy(originalRot);
        }, 50);

        muzzleFlash.intensity = 2;
        setTimeout(() => muzzleFlash.intensity = 0, 50);

        // 玩家射击检测：同时检测敌人和墙壁
        raycaster.setFromCamera(centerScreen, camera);
        const enemyMeshes = enemies.filter(e => e.alive).map(e => e.mesh);
        
        // 获取所有墙壁和掩体的 mesh (用于阻挡子弹)
        const obstacleMeshes = [];
        scene.traverse(child => {
          if (child.isMesh && (child.material === wallMat || child.material === crateMat)) {
             obstacleMeshes.push(child);
          }
        });

        // 合并检测对象
        const allTargets = [...enemyMeshes, ...obstacleMeshes];
        const intersects = raycaster.intersectObjects(allTargets, true);

        const rayStart = camera.position.clone();
        let hitPoint = rayStart.clone().add(raycaster.ray.direction.clone().multiplyScalar(50));
        let hitEnemy = null;

        if (intersects.length > 0) {
          const hit = intersects[0];
          hitPoint = hit.point;
          
          // 检查打中的是不是敌人
          for (let e of enemies) {
            let parent = hit.object;
            while (parent) {
              if (parent === e.mesh) { hitEnemy = e; break; }
              parent = parent.parent;
            }
            if (hitEnemy) break;
          }

          // 如果没打中敌人，说明打中了墙壁，产生火花
          if (!hitEnemy) {
            spawnParticles(hitPoint, 0xffaa00); // 橙色火花
          }
        }

        // 处理敌人受击
        if (hitEnemy) {
          hitEnemy.hp -= 20;
          spawnParticles(hitPoint, 0xff0000); // 红色血雾

          hitEnemy.mesh.traverse(child => {
            if (child.isMesh) {
              child.material.color.setHex(0xffffff);
              setTimeout(() => child.material.color.setHex(0x111111), 50);
            }
          });

          if (hitEnemy.hp <= 0) {
            hitEnemy.alive = false;
            scene.remove(hitEnemy.mesh);
            player.kills++;
            updateUI();
          }
        }

        const muzzlePos = new THREE.Vector3(0.2, -0.15, -0.8).applyMatrix4(camera.matrixWorld);
        createTracer(muzzlePos, hitPoint);
      }

      function checkCollision(newPos) {
        const playerBox = new THREE.Box3(
          new THREE.Vector3(newPos.x - 0.4, 0, newPos.z - 0.4),
          new THREE.Vector3(newPos.x + 0.4, 2, newPos.z + 0.4)
        );
        for (let i = 0; i < obstacles.length; i++) {
          if (playerBox.intersectsBox(obstacles[i])) return true;
        }
        return false;
      }

      // ================= 8. 主循环 =================
      function animate() {
        if (!isRunning) return;
        animationId = requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.1);

        // 玩家移动
        if (document.pointerLockElement === document.body) {
          const speed = 6 * delta;
          const prevPos = controls.getObject().position.clone();

          if (keys.KeyW) controls.moveForward(speed);
          if (keys.KeyS) controls.moveForward(-speed);
          if (keys.KeyA) controls.moveRight(-speed);
          if (keys.KeyD) controls.moveRight(speed);

          if (checkCollision(controls.getObject().position)) {
            controls.getObject().position.copy(prevPos);
          }
        }

        // --- 无限敌人生成 ---
        spawnTimer += delta;
        const aliveEnemies = enemies.filter(e => e.alive).length;
        if (spawnTimer >= SPAWN_INTERVAL && aliveEnemies < MAX_ENEMIES) {
          spawnEnemy();
          spawnTimer = 0;
        }

        // --- 敌人 AI ---
        const playerPos = controls.getObject().position;
        const now = Date.now();

        enemies.forEach(enemy => {
          if (!enemy.alive) return;
          
          const dx = playerPos.x - enemy.mesh.position.x;
          const dz = playerPos.z - enemy.mesh.position.z;
          const dist = Math.sqrt(dx*dx + dz*dz);
          
          if (dist < 20) { // 视野范围
            enemy.mesh.lookAt(playerPos.x, enemy.mesh.position.y, playerPos.z);
            const dir = new THREE.Vector3(dx, 0, dz).normalize();
            
            if (dist > 12) {
              enemy.mesh.position.addScaledVector(dir, enemy.speed * delta);
            } else if (dist < 5) {
              enemy.mesh.position.addScaledVector(dir, -enemy.speed * delta);
            } else {
              const strafeDir = new THREE.Vector3(-dir.z, 0, dir.x);
              const strafeAmount = Math.sin(now * 0.002 + enemy.mesh.position.x) * 0.5;
              enemy.mesh.position.addScaledVector(strafeDir, strafeAmount * enemy.speed * delta);
            }

            // 远程开火
            if (now - enemy.lastAttack > 1500 + Math.random() * 500) {
              // 真实子弹外观 (圆柱体)
              const bulletGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8);
              // 旋转圆柱体使其平躺，指向 Z 轴正向
              bulletGeo.rotateX(Math.PI / 2); 
              const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // 黄色曳光弹
              const bullet = new THREE.Mesh(bulletGeo, bulletMat);
              
              bullet.position.copy(enemy.mesh.position);
              bullet.position.y += 1.2;
              
              const bulletDir = new THREE.Vector3(
                playerPos.x - bullet.position.x,
                playerPos.y - bullet.position.y,
                playerPos.z - bullet.position.z
              ).normalize();
              
              // 让子弹模型朝向飞行方向
              bullet.lookAt(bullet.position.clone().add(bulletDir));
              
              scene.add(bullet);
              
              enemyBullets.push({
                mesh: bullet,
                dir: bulletDir,
                speed: 18, // 稍微加快子弹速度
                life: 3.0,
                prevPos: bullet.position.clone() // 记录上一帧位置，用于射线检测防穿模
              });

              enemy.lastAttack = now;
            }
          }
        });

        // --- 敌方子弹物理检测 (防穿墙、防反弹) ---
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const b = enemyBullets[i];
          
          // 1. 更新位置
          const oldPos = b.mesh.position.clone();
          b.mesh.position.addScaledVector(b.dir, b.speed * delta);
          b.life -= delta;

          // 2. 墙壁碰撞检测 (用射线从上一帧位置射向当前位置，防止高速穿模)
          const moveDist = oldPos.distanceTo(b.mesh.position);
          const ray = new THREE.Raycaster(oldPos, b.dir.clone().normalize(), 0, moveDist);
          
          const obstacleMeshes = [];
          scene.traverse(child => {
            if (child.isMesh && (child.material === wallMat || child.material === crateMat)) {
               obstacleMeshes.push(child);
            }
          });
          
          const wallHits = ray.intersectObjects(obstacleMeshes, false);
          if (wallHits.length > 0) {
            // 打中墙壁，产生火花，销毁子弹
            spawnParticles(wallHits[0].point, 0xffaa00);
            scene.remove(b.mesh);
            b.mesh.geometry.dispose();
            enemyBullets.splice(i, 1);
            continue;
          }

          // 3. 玩家碰撞检测
          if (b.mesh.position.distanceTo(playerPos) < 0.6) {
            player.hp -= 10;
            updateUI();
            damageFlash.style.opacity = '1';
            setTimeout(() => damageFlash.style.opacity = '0', 150);
            
            scene.remove(b.mesh);
            b.mesh.geometry.dispose();
            enemyBullets.splice(i, 1);
            
            if (player.hp <= 0) gameOver();
            continue;
          }

          // 4. 超时销毁
          if (b.life <= 0) {
            scene.remove(b.mesh);
            b.mesh.geometry.dispose();
            enemyBullets.splice(i, 1);
          }
        }

        // --- 更新特效 ---
        // 曳光弹
        for (let i = tracers.length - 1; i >= 0; i--) {
          const t = tracers[i];
          t.life -= delta * 15; // 消失得更快
          t.line.material.opacity = t.life;
          if (t.life <= 0) {
            scene.remove(t.line);
            t.line.geometry.dispose();
            t.line.material.dispose();
            tracers.splice(i, 1);
          }
        }

        // 粒子
        for (let i = pData.length - 1; i >= 0; i--) {
          const p = pData[i];
          p.pos.add(p.vel.clone().multiplyScalar(delta));
          p.vel.y -= 9.8 * delta; // 重力
          p.life -= delta * 2.5;
          if (p.life <= 0) pData.splice(i, 1);
        }
        
        const positions = particleSystem.geometry.attributes.position.array;
        const colors = particleSystem.geometry.attributes.color.array;
        
        for (let i = 0; i < pCount; i++) {
          if (i < pData.length) {
            positions[i*3] = pData[i].pos.x;
            positions[i*3+1] = pData[i].pos.y;
            positions[i*3+2] = pData[i].pos.z;
            
            colors[i*3] = pData[i].color.r;
            colors[i*3+1] = pData[i].color.g;
            colors[i*3+2] = pData[i].color.b;
          } else {
            positions[i*3+1] = -100; // 隐藏
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
        particleSystem.geometry.attributes.color.needsUpdate = true;

        renderer.render(scene, camera);
      }

      function gameOver() {
        isRunning = false;
        cancelAnimationFrame(animationId);
        document.exitPointerLock();
        overlay.style.display = 'flex';
        overlay.innerHTML = `
          <h2>YOU DIED</h2>
          <p>Survived Kills: ${player.kills}</p>
          <button class="g3d-start-btn" id="g3dRestartBtn">Try Again</button>
        `;
        document.getElementById('g3dRestartBtn').onclick = startGame;
      }

      function startGame() {
        overlay.style.display = 'none';
        resetGame();
        isRunning = true;
        clock.start();
        document.body.requestPointerLock();
        animate();
      }

      // ================= 9. 事件监听 =================
      const onKeyDown = (e) => {
        if (e.code in keys) keys[e.code] = true;
        if (e.code === 'KeyR') reload();
      };
      const onKeyUp = (e) => {
        if (e.code in keys) keys[e.code] = false;
      };
      const onMouseDown = (e) => { if (e.button === 0) shoot(); };
      const onResize = () => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      };

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', onMouseDown);
      window.addEventListener('resize', onResize);
      
      const onPointerLockChange = () => {
        if (document.pointerLockElement !== document.body && isRunning) {
          isRunning = false;
          cancelAnimationFrame(animationId);
          overlay.style.display = 'flex';
          overlay.innerHTML = `
            <h2>PAUSED</h2>
            <p>Click Resume to lock mouse again.</p>
            <button class="g3d-start-btn" id="g3dResumeBtn">Resume</button>
          `;
          document.getElementById('g3dResumeBtn').onclick = () => {
            overlay.style.display = 'none';
            isRunning = true;
            document.body.requestPointerLock();
            clock.start();
            animate();
          };
        }
      };
      document.addEventListener('pointerlockchange', onPointerLockChange);

      startBtn.onclick = startGame;

      // ================= 10. 清理 =================
      cleanupFunctions.push(() => {
        isRunning = false;
        cancelAnimationFrame(animationId);
        if (document.pointerLockElement === document.body) document.exitPointerLock();
        document.removeEventListener('keydown', onKeyDown);
        document.removeEventListener('keyup', onKeyUp);
        document.removeEventListener('mousedown', onMouseDown);
        document.removeEventListener('pointerlockchange', onPointerLockChange);
        window.removeEventListener('resize', onResize);
        
        renderer.dispose();
        scene.clear();
        container.innerHTML = '';
      });
    }
  </script>
</body>
</html>
