<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF8233" />
  <meta name="description" content="Esther's personal website. Explore about me, projects, programs, reviews, FAQ, and contacts." />
  <title>Esther · Personal Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; --orange: #F16524; --orange-light: #FF8233; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    a { text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; }
    button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    /* ---------- 原有页面样式（完全保留） ---------- */
    .page { height: 100vh; height: 100dvh; width: 100%; overflow: hidden; position: relative; display: flex; flex-direction: column; isolation: isolate; background: linear-gradient(to bottom, #FF8233, #FDAC55); }
    .background-art { position: absolute; inset: 0; pointer-events: none; opacity: .8; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 95%); mask-image: linear-gradient(to bottom, black 40%, transparent 95%); }
    .background-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .giant-404 { color: #fff; font-size: clamp(200px,48vw,800px); line-height: 1; letter-spacing: -.075em; font-weight: 900; white-space: nowrap; user-select: none; transform-origin: center center; }
    .white-oval { position: absolute; background: #fff; border-radius: 9999px; width: clamp(120px,20vw,400px); height: 50vh; transform-origin: center; }
    .navbar { position: relative; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; gap: 16px; }
    .logo { display: inline-flex; align-items: center; gap: 9px; color: #fff; font-size: 20px; font-weight: 700; white-space: nowrap; }
    .logo-mark { display: grid; grid-template-columns: repeat(2,12px); gap: 2px; }
    .logo-mark span { width: 12px; height: 12px; background: white; border-radius: 50%; }
    .desktop-links { display: flex; gap: 4px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    .desktop-links a, .desktop-links button { background: #fff; color: var(--orange); padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; transition: opacity .2s; white-space: nowrap; border: none; cursor: pointer; }
    .desktop-links a:hover, .desktop-links button:hover { opacity: .9; }
    .menu-btn { display: inline-flex; gap: 9px; align-items: center; justify-content: center; padding: 10px 20px; background: var(--orange); color: white; border-radius: 999px; font-size: 14px; font-weight: 500; transition: opacity .2s; }
    .menu-btn:hover { opacity: .9; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .video-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin-top: calc(-6vh - 40px); pointer-events: none; }
    .video-box { width: 62vw; height: 78vh; position: relative; display: grid; place-items: center; }
    .fox-fallback { position: absolute; inset: 0; display: grid; place-items: center; opacity: 1; transition: opacity .45s ease; }
    .fox-illustration { width: min(68%, 440px); max-height: 74%; overflow: visible; filter: drop-shadow(0 20px 12px #a8431533); animation: fox-bob 3.5s ease-in-out infinite; }
    .fox-tail { transform-origin: 75% 73%; animation: fox-wag 2.4s ease-in-out infinite; }
    .fox-eye { transform-origin: center; animation: fox-blink 5s ease-in-out infinite; }
    @keyframes fox-bob { 0%,100% { transform: translateY(6px) rotate(-1deg); } 50% { transform: translateY(-13px) rotate(1deg); } }
    @keyframes fox-wag { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(9deg); } }
    @keyframes fox-blink { 0%,43%,47%,100% { transform: scaleY(1); } 45% { transform: scaleY(.10); } }
    .video-box.video-playing .fox-fallback { opacity: 0; }
    .video-box video { opacity: 0; transition: opacity .45s ease; position: relative; z-index: 1; }
    .video-box.video-playing video { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .fox-illustration,.fox-tail,.fox-eye { animation: none; } }
    .video-box video { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: darken; pointer-events: none; }
    .bottom { position: relative; z-index: 30; margin-top: auto; padding: 0 16px 64px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .bottom h1 { color: #fff; font-weight: 500; font-size: 24px; line-height: 1.4; margin-bottom: 16px; }
    .home-link { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 999px; padding: 16px 32px; background: var(--orange); color: #fff; font-size: 16px; font-weight: 600; transition: transform .25s, box-shadow .25s; }
    .home-link:hover { transform: scale(1.05); box-shadow: 0 12px 30px #9d411e40; }

    /* ---------- 内容面板（新加，覆盖在 404 之上） ---------- */
    .content-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: linear-gradient(to bottom, #FF8233, #FDAC55);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .3s ease, visibility 0s linear .3s;
      overflow-y: auto;
    }
    .content-overlay.open {
      opacity: 1; visibility: visible; pointer-events: auto;
      transition: opacity .3s ease, visibility 0s linear 0s;
    }
    .content-card {
      background: rgba(255,255,255,0.97);
      border-radius: 32px;
      max-width: 780px; width: 100%;
      padding: 48px 44px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.15);
      position: relative;
      margin: auto;
    }
    .content-close {
      position: absolute; top: 18px; right: 18px;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--orange-light); color: #fff;
      display: grid; place-items: center;
      transition: background .2s, transform .2s;
      z-index: 2;
    }
    .content-close:hover { background: var(--orange); transform: rotate(90deg); }
    .content-card .eyebrow {
      display: inline-block; font-size: 13px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--orange); background: #fff3ec;
      padding: 6px 14px; border-radius: 999px; margin-bottom: 20px;
    }
    .content-card h1 {
      font-size: clamp(30px, 4.5vw, 42px); font-weight: 800;
      color: #2d1f15; line-height: 1.15; letter-spacing: -0.02em;
      margin-bottom: 24px;
    }
    .content-card h1 .name { color: var(--orange); }
    .content-card p { font-size: 16px; line-height: 1.8; color: #4a3a2e; margin-bottom: 16px; }
    .content-card p:last-of-type { margin-bottom: 0; }
    .content-card strong { color: #2d1f15; font-weight: 700; }
    .content-card .divider { height: 1px; background: #f0e4da; margin: 28px 0; }
    .content-card .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 20px 0 8px; }
    .content-card .mini { background: #fff7f1; border-radius: 18px; padding: 22px 20px; }
    .content-card .mini .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--orange); background: #ffe6d8; padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
    .content-card .mini h3 { font-size: 17px; color: #2d1f15; margin-bottom: 6px; font-weight: 700; }
    .content-card .mini p { font-size: 14px; line-height: 1.6; color: #5b4b3e; margin: 0; }
    .content-card .review { background: #fff7f1; border-radius: 18px; padding: 22px 20px; }
    .content-card .review .stars { color: #f5a623; font-size: 16px; letter-spacing: 2px; margin-bottom: 10px; }
    .content-card .review blockquote { font-size: 14.5px; line-height: 1.65; color: #3d2e23; font-style: italic; margin-bottom: 14px; }
    .content-card .review .who { font-size: 13px; color: #8a7866; }
    .content-card .review .who strong { color: #2d1f15; display: block; font-weight: 600; font-size: 14px; }
    .content-card .faq { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
    .content-card .faq .item { background: #fff7f1; border-radius: 16px; padding: 18px 20px; }
    .content-card .faq .q { font-size: 15.5px; font-weight: 700; color: #2d1f15; margin-bottom: 6px; display: flex; gap: 10px; align-items: flex-start; }
    .content-card .faq .q .qm { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: var(--orange-light); color: #fff; border-radius: 50%; font-size: 13px; flex: none; margin-top: 1px; }
    .content-card .faq .a { font-size: 14.5px; line-height: 1.65; color: #5b4b3e; margin-left: 34px; }
    .content-card .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin: 20px 0 8px; }
    .content-card .contact-item { background: #fff7f1; border-radius: 18px; padding: 22px 18px; text-align: center; }
    .content-card .contact-item .ci { width: 44px; height: 44px; border-radius: 50%; background: var(--orange-light); color: #fff; display: grid; place-items: center; margin: 0 auto 12px; }
    .content-card .contact-item .ci .icon { width: 20px; height: 20px; }
    .content-card .contact-item h3 { font-size: 15px; color: #2d1f15; margin-bottom: 6px; font-weight: 700; }
    .content-card .contact-item p { font-size: 14px; color: #5b4b3e; line-height: 1.5; margin: 0; word-break: break-word; }
    .content-card .contact-item p a { color: var(--orange); font-weight: 600; }
    .content-card .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid #f0e4da; }
    .content-card .actions a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; font-size: 14px; font-weight: 600; transition: transform .2s, background .2s; }
    .content-card .actions .primary { background: var(--orange-light); color: #fff; }
    .content-card .actions .primary:hover { background: var(--orange); transform: translateY(-2px); }
    .content-card .actions .secondary { background: #fff3ec; color: var(--orange); }
    .content-card .actions .secondary:hover { background: #ffe6d8; transform: translateY(-2px); }
    .content-card .actions .icon { width: 16px; height: 16px; }

    /* 移动端菜单覆盖层（原有） */
    .overlay { position: fixed; inset: 0; z-index: 50; visibility: hidden; pointer-events: none; transition: visibility 0s linear .5s; }
    .overlay.open { visibility: visible; pointer-events: auto; transition-delay: 0s; }
    .backdrop { position: absolute; inset: 0; background: #0006; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; transition: opacity .5s; }
    .overlay.open .backdrop { opacity: 1; }
    .panel { position: absolute; top: 0; right: 0; height: 100%; width: 380px; max-width: 100%; padding: 24px; background: linear-gradient(135deg, #FF6B1A, #FF9642); transform: translateX(100%); transition: transform .5s cubic-bezier(.16,1,.3,1); display: flex; flex-direction: column; }
    .overlay.open .panel { transform: translateX(0); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; }
    .close-btn { width: 40px; height: 40px; border-radius: 50%; background: #ffffff33; color: #fff; display: grid; place-items: center; transition: background .2s; }
    .close-btn:hover { background: #ffffff55; }
    .panel-links { display: flex; flex-direction: column; gap: 12px; margin-top: 64px; }
    .panel-links a, .panel-links button { color: white; background: #ffffff1a; border-radius: 16px; padding: 16px 24px; font-size: 18px; font-weight: 600; opacity: 0; transform: translateY(16px); transition: opacity .3s, transform .3s, background .3s; transition-delay: 0ms; text-align: left; border: none; cursor: pointer; }
    .panel-links a:hover, .panel-links button:hover { background: #ffffff33; }
    .overlay.open .panel-links a, .overlay.open .panel-links button { opacity: 1; transform: translateY(0); transition-delay: calc(150ms + var(--i) * 60ms); }
    .panel-cta { margin-top: auto; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; background: #fff; color: var(--orange); border-radius: 999px; font-size: 16px; font-weight: 600; opacity: 0; transform: translateY(12px); transition: opacity .35s, transform .35s; }
    .overlay.open .panel-cta { opacity: 1; transform: translateY(0); transition-delay: .45s; }
    .panel-cta:hover { transform: scale(1.02) !important; }

    @media (max-width: 1023px) { .desktop-links { display: none; } }
    @media (max-width: 767px) { .navbar { padding: 16px 24px; } .video-box { width: 70vw; height: 70vh; } .bottom h1 { font-size: 20px; } .bottom { padding-bottom: 48px; } .white-oval { height: 26vh; } .content-card { padding: 36px 26px; border-radius: 24px; } }
    @media (max-width: 639px) { .navbar { padding: 16px; } .logo { font-size: 18px; } .logo-mark { grid-template-columns: repeat(2,10px); } .logo-mark span { width: 10px; height: 10px; } .menu-btn { padding: 9px 16px; } .menu-btn .menu-label { display: none; } .video-box { width: 120vw; height: 85vh; } .bottom { padding-bottom: 32px; } .bottom h1 { font-size: 18px; margin-bottom: 12px; } .home-link { padding: 12px 24px; font-size: 14px; } .white-oval { height: 22vh; } .panel { width: 100%; } .content-card { padding: 30px 20px; border-radius: 20px; } .content-card h1 { font-size: 28px; } .content-card .faq .a { margin-left: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <!-- ===== 原有 404 主界面（完全保留） ===== -->
  <main class="page">
    <div class="background-art" aria-hidden="true"><div class="background-center"><div class="giant-404" id="giant404">404</div><div class="white-oval" id="whiteOval"></div></div></div>
    <header class="navbar">
      <a class="logo" href="/" aria-label="Esther home"><span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>Esther</span></a>
      <nav class="desktop-links" aria-label="Main navigation">

        <button type="button" data-section="projects">Projects</button>
        <button type="button" data-section="programs">Programs</button>

        <button type="button" data-section="faq">FAQ</button>
        <button type="button" data-section="contacts">Contacts</button>
      </nav>
      <button class="menu-btn" id="menuOpen" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="menuOverlay"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="menu-label">Menu</span></button>
    </header>
    <div class="video-layer" aria-hidden="true"><div class="video-box" id="foxVideoBox">
      <div class="fox-fallback">
        <svg class="fox-illustration" viewBox="0 0 480 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="234" cy="447" rx="160" ry="19" fill="#C75020" opacity=".15" />
          <g class="fox-tail">
            <path d="M302 336 C395 275 462 339 447 398 C434 447 374 453 329 421 C362 420 390 407 399 388 C354 407 310 399 284 388Z" fill="#F76B28" stroke="#B94A19" stroke-width="5" stroke-linejoin="round" />

          <path d="M101 168 C110 104 174 78 240 83 C318 80 380 130 385 211 C391 278 352 345 285 368 C232 387 166 369 130 335 C93 300 79 227 101 168Z" fill="#F47730" stroke="#AD481F" stroke-width="6" />
          <path d="M99 229 C112 276 140 305 199 314 C217 327 233 345 242 359 C253 341 275 326 291 317 C344 311 376 278 386 229 C362 245 336 257 313 258 C278 259 262 243 243 228 C218 246 206 259 173 260 C141 259 119 246 99 229Z" fill="#FFF9EE" />
          <ellipse cx="172" cy="228" rx="14" ry="19" fill="#432A26" class="fox-eye" />
          <ellipse cx="313" cy="228" rx="14" ry="19" fill="#432A26" class="fox-eye" />
          <circle cx="177" cy="221" r="4" fill="white" /><circle cx="318" cy="221" r="4" fill="white" />
          <ellipse cx="242" cy="293" rx="23" ry="17" fill="#5B3027" />

        </svg>
      </div>
      <video id="foxVideo" autoplay loop muted playsinline preload="auto"><source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_234424_b1332b69-2e69-4302-8dbc-40f86846afbd.mp4" type="video/mp4" /></video>
    </div></div>
    <section class="bottom"><h1>Oops, something went wrong!</h1><a class="home-link" href="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg>Back to Home</a></section>
  </main>

  <!-- ===== 移动端菜单（原有，但链接改为触发内容面板） ===== -->
  <div class="overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="Navigation menu" aria-hidden="true">
    <div class="backdrop" id="menuBackdrop"></div>
    <aside class="panel"><div class="panel-header"><a class="logo" href="/"><span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span><span>Esther</span></a><button class="close-btn" id="menuClose" type="button" aria-label="Close menu"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <nav class="panel-links" aria-label="Mobile navigation">
        <button type="button" style="--i:0" data-section="about">About Me</button>
        <button type="button" style="--i:1" data-section="projects">Projects</button>
        <button type="button" style="--i:2" data-section="programs">Programs</button>
        <button type="button" style="--i:3" data-section="reviews">Reviews</button>
        <button type="button" style="--i:4" data-section="faq">FAQ</button>
        <button type="button" style="--i:5" data-section="contacts">Contacts</button>
      </nav>
      <a class="panel-cta" href="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg>Back to Home</a>
    </aside>
  </div>

  <!-- ===== 新增：内容面板（点击导航后显示） ===== -->
  <div class="content-overlay" id="contentOverlay" role="dialog" aria-modal="true" aria-label="Content panel" aria-hidden="true">
    <div class="content-card" id="contentCard">
      <button class="content-close" id="contentClose" type="button" aria-label="Close content">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div id="contentBody"><!-- 动态填充 --></div>
    </div>
  </div>

  <script>
    (() => {
      /* ---------- 视频与背景缩放（原有逻辑） ---------- */
      const foxVideo = document.getElementById('foxVideo');
      const foxVideoBox = document.getElementById('foxVideoBox');
      foxVideo.addEventListener('playing', () => { if (foxVideo.videoWidth > 0) foxVideoBox.classList.add('video-playing'); });
      foxVideo.addEventListener('error', () => foxVideoBox.classList.remove('video-playing'));
      foxVideo.addEventListener('stalled', () => foxVideoBox.classList.remove('video-playing'));
      foxVideo.play().catch(() => foxVideoBox.classList.remove('video-playing'));

      const giant = document.getElementById('giant404');
      const oval = document.getElementById('whiteOval');
      function resizeBackground() {
        const scaleY = window.innerHeight / (giant.offsetHeight || 1);
        giant.style.transform = `scale(1.15, ${scaleY * 1.4})`;
        oval.style.transform = `scaleY(${scaleY})`;
      }
      window.addEventListener('resize', resizeBackground, { passive: true });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(resizeBackground);
      resizeBackground();

      /* ---------- 移动端菜单（原有逻辑） ---------- */
      const overlay = document.getElementById('menuOverlay');
      const openBtn = document.getElementById('menuOpen');
      const closeBtn = document.getElementById('menuClose');
      const backdrop = document.getElementById('menuBackdrop');
      function setMenu(open) {
        overlay.classList.toggle('open', open);
        overlay.setAttribute('aria-hidden', String(!open));
        openBtn.setAttribute('aria-expanded', String(open));
        document.body.style.overflow = open ? 'hidden' : '';
        if (open) closeBtn.focus(); else openBtn.focus();
      }
      openBtn.addEventListener('click', () => setMenu(true));
      closeBtn.addEventListener('click', () => setMenu(false));
      backdrop.addEventListener('click', () => setMenu(false));
      overlay.querySelectorAll('a, button').forEach(el => el.addEventListener('click', () => setMenu(false)));
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && overlay.classList.contains('open')) setMenu(false);
        if (e.key === 'Tab' && overlay.classList.contains('open')) {
          const focusables = [...overlay.querySelectorAll('a,button')];
          const first = focusables[0], last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });

      /* ---------- 内容面板 ---------- */
      const contentOverlay = document.getElementById('contentOverlay');
      const contentCard = document.getElementById('contentCard');
      const contentBody = document.getElementById('contentBody');

      function openContent(section) {
        if (!sections[section]) return;
        contentBody.innerHTML = sections[section];
        contentOverlay.classList.add('open');
        contentOverlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        setTimeout(() => contentClose.focus(), 50);
      }

      function closeContent() {
        contentOverlay.classList.remove('open');
        contentOverlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      // 绑定所有 data-section 按钮（桌面导航 + 移动菜单）
      document.querySelectorAll('[data-section]').forEach(btn => {
        btn.addEventListener('click', () => {
          const section = btn.getAttribute('data-section');
          // 如果移动菜单开着，先关掉
          if (overlay.classList.contains('open')) setMenu(false);
          openContent(section);
        });
      });

      contentClose.addEventListener('click', closeContent);
      contentOverlay.addEventListener('click', (e) => {
        if (e.target === contentOverlay) closeContent();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && contentOverlay.classList.contains('open')) closeContent();
      });

      // 内容面板内的 “Back to Home” 链接点击后关闭面板（因为 href="/" 会刷新，这里改为事件关闭）
      contentOverlay.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (link && link.getAttribute('href') === '/') {
          e.preventDefault();
          closeContent();
        }
      });
